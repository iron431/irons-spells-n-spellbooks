def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
        minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version, forge_version_range: forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors            : mod_authors, mod_description: mod_description, mod_credits: mod_credits,
        mod_issue_tracker      : mod_issue_tracker, mod_display_url: mod_display_url,
        mod_logo_file          : mod_logo_file,
        curios_version         : curios_version,
        player_animator_version: player_animator_version,
        geckolib_version       : geckolib_version
]

processResources {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_name,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "mixins.irons_spellbooks.json"
        ])
    }
    exclude('**/*.psd')
    exclude('**/*.bbmodel')
}

// Example configuration to allow publishing using the maven-publish plugin
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')
// However if you are in a multi-project ], dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
// publish.dependsOn('reobfJar')
java {
    withSourcesJar()
    //withJavadocJar()
}

tasks.register('apiJar', Jar) {
    archiveClassifier.set('api')
    include 'io/redspace/ironsspellbooks/api/**/*'
    from sourceSets.main.allSource
    from sourceSets.main.output
}

artifacts {
    archives apiJar
    archives sourcesJar
}

publishing {
    tasks.publish.dependsOn 'build'
    publications {

        mavenJava(MavenPublication) {
            artifactId project.archivesBaseName
            artifact jar
            artifact sourcesJar
            artifact apiJar
        }
    }

    repositories {
        maven {
            name = "redspace"

            if (project.version.endsWith('-SNAPSHOT')) {
                url uri("https://code.redspace.io/snapshots")
            } else {
                url uri("https://code.redspace.io/releases")
            }

            credentials {
                username = System.getenv("MAVEN_USER")
                password = System.getenv("MAVEN_PASS")
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.register('copyAnimations', Copy) {
    from "src/main/resources/assets/${mod_id}/player_animation"
    include 'casting_animations.json'
    into "src/main/resources/assets/${mod_id}/animations"
}

tasks.register("check_depluralized_directories") {
    // Detect depluralized directories from 1.21.1 merges
    // https://docs.neoforged.net/primer/docs/1.21/neo
    def baseDirs = ["tags/block", "tags/entity_type", "tags/fluid", "tags/item", "recipe", "advancement", "structure", "loot_table"]
    def namespaces = ["c", "irons_spellbooks", "minecraft"]

    doLast {
        def offendingDirs = []

        // Generate all combinations
        namespaces.each { ns ->
            baseDirs.each { base ->
                def dir = file("src/main/resources/data/$ns/$base") // combinatorial path
                println "Checking " + dir
                if (dir.exists()) {
                    offendingDirs << [dir: dir]
                }
            }
        }

        if (!offendingDirs.isEmpty()) {
            println "\nDepluralized files detected:"
            offendingDirs.each {
                println " - ${it.dir.path}:"
            }
            throw new GradleException("Build failed: Depluralized files found in ${offendingDirs*.dir.path.join(', ')}.")
        } else {
            println "Depluralized check passed."
        }
    }
}
tasks.classes.dependsOn(tasks.copyAnimations, tasks.check_depluralized_directories)
tasks.processResources.dependsOn(tasks.copyAnimations, tasks.check_depluralized_directories)
tasks.sourcesJar.dependsOn(tasks.copyAnimations, tasks.check_depluralized_directories)


mixin {
    add sourceSets.main, 'irons_spellbooks.refmap.json'
    config 'mixins.irons_spellbooks.json'
}
